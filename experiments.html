<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f4f4">
<title>EXPERIMENTS — RYOICHIRO</title>
<style>
:root{--bg:#f4f4f4;--ink:#080808;--line:#bdbdbd;--muted:#666;--gutter:clamp(18px,4vw,64px)}
:root[data-theme="dark"]{--bg:#111;--ink:#f2f2f2;--line:#555;--muted:#aaa;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:calc(100% - var(--gutter)*2);max-width:1600px;margin:auto}
header{position:sticky;top:0;z-index:1000;background:var(--bg);border-bottom:1px solid var(--ink);min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.brand{font-size:14px;font-weight:900;letter-spacing:-.04em}
.glyph-i{display:inline-block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;transform:translateY(-.035em) rotate(-7deg) scaleX(.86);transform-origin:50% 75%;margin-left:-.012em;margin-right:-.012em}
.nav{display:flex;align-items:center;gap:clamp(6px,1.5vw,22px);flex-wrap:wrap;justify-content:flex-end}
.nav a,.theme-toggle{border:1px solid var(--ink);border-radius:999px;padding:8px 12px;white-space:nowrap;font:inherit;background:transparent;color:var(--ink)}
.nav a{font-size:9px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.theme-toggle{cursor:pointer;letter-spacing:.1em}
.hero{padding:clamp(80px,15vh,190px) 0 70px;border-bottom:1px solid var(--ink);min-height:72vh;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow,.index{font-size:10px;letter-spacing:.15em;text-transform:uppercase}
h1{font-size:clamp(72px,18vw,260px);line-height:.72;letter-spacing:-.11em;text-transform:uppercase;margin:0;font-weight:900}
h1 .i{display:inline-block;font-family:Georgia,serif;font-style:italic;font-weight:400;transform:rotate(-8deg) translateY(-.03em)}
.hero-bottom{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-top:70px}
.hero-bottom p{max-width:470px;font-size:clamp(14px,1.6vw,20px);line-height:1.75;margin:0}
.hero-note{font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:22px 0;border-bottom:1px solid var(--ink)}
.filters a{border:1px solid var(--ink);border-radius:999px;padding:8px 14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.filters a:hover{background:var(--ink);color:var(--bg)}
.section{padding:95px 0;border-bottom:1px solid var(--ink)}
.section-head{display:grid;grid-template-columns:1fr 3fr;gap:20px;margin-bottom:45px;align-items:start}
h2{font-size:clamp(48px,9vw,130px);line-height:.8;letter-spacing:-.09em;text-transform:uppercase;margin:0}
.section-intro{font-size:13px;line-height:1.9;color:var(--muted);max-width:560px;margin:0}
.editorial-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:28px 16px;align-items:start}
.entry{margin:0;min-width:0}
.entry:nth-child(1){grid-column:1/8}
.entry:nth-child(2){grid-column:9/13;margin-top:100px}
.entry:nth-child(3){grid-column:2/7}
.entry:nth-child(4){grid-column:8/13;margin-top:80px}
.entry-visual{min-height:240px;aspect-ratio:1.35;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px}
.entry:nth-child(2) .entry-visual{aspect-ratio:.9}
.entry:nth-child(3) .entry-visual{aspect-ratio:1.05}
.entry:nth-child(4) .entry-visual{aspect-ratio:1.2}
.entry-visual span{font-size:clamp(36px,7vw,100px);font-weight:900;letter-spacing:-.1em;line-height:.8;text-transform:uppercase}
.entry-visual small{position:absolute;left:18px;bottom:16px;font-size:9px;letter-spacing:.12em}
.entry figcaption{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--ink);padding-top:10px;margin-top:10px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.entry figcaption span:last-child{color:var(--muted);text-align:right}
.empty-note{border:1px solid var(--line);padding:22px;font-size:11px;line-height:1.8;color:var(--muted);margin-top:30px}
footer{border-top:1px solid var(--ink);padding:18px 0 25px;display:flex;justify-content:space-between;gap:15px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:700px){
 header{min-height:0;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px}
 .brand{grid-column:1;grid-row:1}
 .theme-toggle{grid-column:2;grid-row:1}
 .nav{grid-column:1/-1;grid-row:2;justify-content:space-between;gap:5px;flex-wrap:nowrap}
 .nav a{font-size:7px;padding:6px 7px;letter-spacing:.03em}
 .hero{min-height:70svh;padding:85px 0 35px}
 h1{font-size:20vw}
 .hero-bottom{align-items:flex-start;flex-direction:column;margin-top:55px}
 .hero-note{white-space:normal}
 .filters{gap:6px}.filters a{font-size:9px;padding:7px 11px}
 .section{padding:65px 0}
 .section-head{grid-template-columns:1fr;gap:22px;margin-bottom:32px}
 h2{font-size:17vw}
 .editorial-grid{display:flex;flex-direction:column;gap:38px}
 .entry{width:100%}.entry:nth-child(even){width:88%;align-self:flex-end;margin:0}
 .entry-visual{min-height:210px}
 footer{flex-wrap:wrap}
}


/* Loose, mixed-media archive */
.canvas{padding:22px 0 90px}
.canvas-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--ink);padding:10px 0;font-size:9px;letter-spacing:.13em}
.masonry{columns:3 240px;column-gap:18px;padding-top:26px}
.tile{break-inside:avoid;margin:0 0 28px;display:block}
.tile-a{width:100%}.tile-b{width:88%;margin-left:auto}.tile-c{width:76%}.tile-d{width:100%}.tile-e{width:83%;margin-left:auto}.tile-f{width:100%}.tile-g{width:90%}.tile-h{width:75%;margin-left:10%}
.tile figcaption{font-size:9px;letter-spacing:.08em;color:var(--muted);padding-top:7px}
.drawing-image{display:block;width:100%;height:auto;background:#fff;cursor:zoom-in;transition:opacity .2s ease}
.drawing-image:hover{opacity:.88}
.drawing-lightbox{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.drawing-lightbox.is-open{display:flex}
.drawing-lightbox img{display:block;max-width:min(94vw,1500px);max-height:92vh;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 50px rgba(0,0,0,.25)}
.drawing-lightbox button{position:absolute;top:16px;right:18px;border:1px solid #fff;border-radius:999px;background:transparent;color:#fff;padding:10px 14px;font:inherit;font-size:12px;cursor:pointer}
@media(max-width:700px){.drawing-lightbox{padding:12px}.drawing-lightbox img{max-width:96vw;max-height:88vh}}
.tile-drawing{background:transparent}
.tile-drawing figcaption{display:flex;justify-content:space-between;gap:10px}
.tile-drawing figcaption span:last-child{color:var(--muted)}
.art-placeholder{width:100%;aspect-ratio:1/1.12;background:#111;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#f4f4f4}
.art-lines{background:#e7e5df}
.art-lines span{position:absolute;width:130%;height:1px;background:#111;transform:rotate(-28deg)}
.art-lines span:nth-child(1){top:30%;left:-10%}.art-lines span:nth-child(2){top:52%;left:-5%;transform:rotate(19deg)}.art-lines span:nth-child(3){top:73%;left:-10%;transform:rotate(-8deg)}
.art-grid{background:#1c1c1c}.art-grid:before{content:"";position:absolute;inset:12%;border:1px solid #ddd;transform:rotate(-12deg)}
.art-grid span{font:italic clamp(35px,6vw,75px)/.85 Georgia,serif;letter-spacing:-.08em}
.art-figure{background:#b9b9b4}.art-figure span{width:38%;height:75%;border:2px solid #111;border-radius:48% 52% 40% 60%;transform:rotate(13deg);position:relative}
.art-figure span:after{content:"";position:absolute;width:160%;height:1px;background:#111;top:45%;left:-30%;transform:rotate(-25deg)}
.art-type{background:#d6d4cc;color:#111;font:900 clamp(65px,10vw,120px)/.75 Arial,sans-serif;letter-spacing:-.12em;display:block;padding:10%}
.art-scribble{background:#f2f0eb}
.art-scribble span{position:absolute;width:75%;height:65%;border:1px solid #111;border-radius:50%;transform:rotate(32deg)}
.art-scribble span+span{width:55%;height:95%;transform:rotate(-27deg)}
.audio-cover{aspect-ratio:1.45;background:#172e43;color:#e9f0f3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.apple-player{display:block;width:100%;height:175px;border:0;background:transparent}
.youtube-player{display:block;width:100%;aspect-ratio:16/9;height:auto;border:0;background:#000}
.apple-track-label{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--ink);font-size:9px;letter-spacing:.08em;color:var(--muted)}
.apple-track-label strong{color:var(--ink);font-weight:500}
.audio-cover span{font:900 clamp(40px,7vw,90px)/.78 Arial,sans-serif;letter-spacing:-.1em;transform:rotate(-8deg)}
.audio-cover-light{background:#d8d5ca;color:#111}
.mini-player{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--ink);background:var(--bg);color:var(--ink)}
.play{width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;background:transparent;color:var(--ink);font-size:10px;flex:0 0 auto;cursor:pointer}
.track-info{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:5px 8px;font-size:10px}
.track-info small{font-size:8px;color:var(--muted)}
.track-line{grid-column:1/-1;height:2px;background:var(--line)}
.track-line i{display:block;width:0;height:100%;background:var(--ink)}
.sound-mark{font-size:17px}
@media(max-width:700px){.canvas{padding-top:14px}.masonry{columns:2 135px;column-gap:12px;padding-top:18px}.tile{margin-bottom:20px}.tile-b,.tile-g{width:100%}.tile-c,.tile-e,.tile-h{width:90%}.mini-player{gap:8px;padding:9px 6px}.track-info{font-size:9px}.play{width:27px;height:27px}}
.nav a:nth-child(3){letter-spacing:inherit}

/* Header stays fully opaque while page content scrolls behind it */
header{
  isolation:isolate;
  background-color:var(--bg)!important;
}
header::before{
  content:"";
  position:absolute;
  z-index:-1;
  top:0;
  bottom:0;
  left:calc((100vw - 100%)/-2);
  right:calc((100vw - 100%)/-2);
  background:var(--bg);
  border-bottom:1px solid var(--ink);
  pointer-events:none;
}
/* Tilt every interface/display I consistently without adding visual gaps */
.accent-i,.glyph-i{
  display:inline-block;
  font-style:italic;
  transform:rotate(-9deg);
  transform-origin:50% 55%;
  letter-spacing:-.04em;
  margin-left:-.012em;
  margin-right:-.012em;
}
.nav a[href*="experiments"]{
  letter-spacing:0!important;
  white-space:nowrap;
}
.nav a[href*="experiments"] .accent-i{
  letter-spacing:-.12em!important;
  margin-left:-.04em;
  margin-right:-.04em;
}

/* v55 navigation and conversion refinements */
.nav{align-items:center}
.nav .experiments-nav{margin-left:auto;justify-content:flex-end;text-align:right}
.nav .contact-nav{position:relative;outline:1px solid var(--ink);outline-offset:3px}
.nav .contact-nav::after{display:none!important}
@media(max-width:700px){
  .nav{display:flex!important;justify-content:space-between!important;gap:4px!important}
  .nav .experiments-nav{margin-left:0!important}
  .nav .contact-nav{outline-offset:2px}
}

/* Match the home-page header structure */
header{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-rows:auto;column-gap:clamp(10px,2vw,28px);min-height:70px;height:auto;padding:10px 0}
header .brand{grid-column:1;grid-row:1}
header .nav{grid-column:2;grid-row:1;justify-content:space-between;gap:clamp(5px,1vw,16px);flex-wrap:nowrap}
header .availability{display:block;grid-column:3;grid-row:1;white-space:nowrap}
header .theme-toggle{grid-column:4;grid-row:1}
header .nav a{padding:8px 10px;font-size:9px}
@media(max-width:700px){
 header{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;row-gap:9px;column-gap:10px;padding:8px 0}
 header .brand{grid-column:1;grid-row:1}
 header .theme-toggle{grid-column:2;grid-row:1}
 header .availability{display:none}
 header .nav{grid-column:1/-1;grid-row:2;width:100%;gap:4px}
 header .nav a{padding:6px 7px;font-size:7px;letter-spacing:.035em}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="brand" href="index.html">RYO<span class="glyph-i">I</span>CH<span class="glyph-i">I</span>RO</a>
<nav class="nav" aria-label="Main navigation">
<a href="index.html#work">WORK</a><a href="index.html#about">ABOUT</a><a href="index.html#background">BACKGROUND</a><a href="index.html#contact" class="contact-nav">CONTACT</a><a href="experiments.html" aria-current="page" class="experiments-nav">EXPERIMENTS</a>
</nav>
<span class="availability">Tokyo / Japan</span>
<button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme"><span class="theme-icon" aria-hidden="true">◐</span><span class="theme-label">DARK</span></button>
</header>
<main>
<section class="canvas">
  <div class="canvas-head"><span>PERSONAL ARCHIVE</span><span>2026 — ONGOING</span></div>
  <div class="masonry">
    <figure class="tile tile-drawing tile-a"><img class="drawing-image" src="assets/drawing-01.jpg" alt="白黒の線画。皿に盛られた料理とカップ、スプーンのドローイング" loading="lazy"><figcaption><span>Untitled / 01</span><span>DRAWING</span></figcaption></figure>
    <div class="tile tile-audio tile-b">
      <iframe class="apple-player" title="誘波 by TØGARÜ on Apple Music" src="https://embed.music.apple.com/jp/song/1857852657?theme=auto" allow="autoplay *; encrypted-media *;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation" loading="lazy"></iframe>
      <div class="apple-track-label"><strong>誘波 / TØGARÜ</strong><span>APPLE MUSIC</span></div>
      <figcaption>Music / 2025</figcaption>
    </div>
    <figure class="tile tile-drawing tile-c"><img class="drawing-image" src="assets/drawing-02.jpg" alt="手と小さな魚の群れを描いたドローイング" loading="lazy"><figcaption><span>Untitled / 02</span><span>DRAWING</span></figcaption></figure>
    <div class="tile tile-video tile-d">
      <iframe class="youtube-player" title="Live video on YouTube" src="https://www.youtube-nocookie.com/embed/8FcIUQ6g0R0" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <div class="apple-track-label"><strong>Live video</strong><span>YOUTUBE</span></div>
      <figcaption>Live / Video archive</figcaption>
    </div>
    <figure class="tile tile-drawing tile-e"><img class="drawing-image" src="assets/drawing-03.jpg" alt="人物の後ろ姿と風景を描いたモノクロのドローイング" loading="lazy"><figcaption><span>Untitled / 03</span><span>DRAWING</span></figcaption></figure>
    <figure class="tile tile-drawing tile-f"><img class="drawing-image" src="assets/drawing-04.jpg" alt="青い線で描かれた人物のドローイング" loading="lazy"><figcaption><span>Untitled / 04</span><span>DRAWING</span></figcaption></figure>
    <figure class="tile tile-drawing tile-g"><img class="drawing-image" src="assets/drawing-05.jpg" alt="細密な模様を重ねた円形のペン画" loading="lazy"><figcaption><span>Untitled / 05</span><span>DRAWING</span></figcaption></figure>
    <figure class="tile tile-drawing tile-h"><img class="drawing-image" src="assets/drawing-06.jpg" alt="黒い線を重ねて描いた球体のような抽象画" loading="lazy"><figcaption><span>Untitled / 06</span><span>DRAWING</span></figcaption></figure>
    <figure class="tile tile-drawing tile-a"><img class="drawing-image" src="assets/drawing-07.jpg" alt="カップと手書きの文字を描いたシンプルな線画" loading="lazy"><figcaption><span>Untitled / 07</span><span>DRAWING</span></figcaption></figure>
    <figure class="tile tile-drawing tile-e"><img class="drawing-image" src="assets/drawing-08.jpg" alt="花をラフな線で描いたドローイング" loading="lazy"><figcaption><span>Untitled / 08</span><span>DRAWING</span></figcaption></figure>
  </div>
</section>
</main>
<div class="drawing-lightbox" id="drawing-lightbox" role="dialog" aria-modal="true" aria-label="Drawing enlarged view">
  <button type="button" aria-label="Close enlarged image">CLOSE ×</button>
  <img src="" alt="">
</div>

<footer><span>RYOICHIRO</span><span>Personal Experiments</span><span>© 2026</span></footer>
</div>
<script>
(() => {
 const root=document.documentElement,button=document.querySelector('.theme-toggle');
 let saved=null;try{saved=localStorage.getItem('ryoichiro-theme')}catch(e){}
 const apply=theme=>{root.setAttribute('data-theme',theme);const dark=theme==='dark';button.querySelector('.theme-label').textContent=dark?'LIGHT':'DARK';button.querySelector('.theme-icon').textContent=dark?'☼':'◐';};
 apply(saved==='dark'?'dark':'light');
 button.addEventListener('click',()=>{const next=root.getAttribute('data-theme')==='dark'?'light':'dark';apply(next);try{localStorage.setItem('ryoichiro-theme',next)}catch(e){}});
})();
</script>

<script>
(() => {
 const overlay=document.getElementById('drawing-lightbox');
 if(!overlay) return;
 const enlarged=overlay.querySelector('img');
 const closeButton=overlay.querySelector('button');
 const close=()=>{overlay.classList.remove('is-open');enlarged.removeAttribute('src');document.body.style.overflow='';};
 document.querySelectorAll('.drawing-image').forEach(img=>{
   img.setAttribute('tabindex','0');img.setAttribute('role','button');img.setAttribute('aria-label','ドローイングを拡大表示');
   const open=()=>{enlarged.src=img.currentSrc||img.src;enlarged.alt=img.alt;overlay.classList.add('is-open');document.body.style.overflow='hidden';closeButton.focus();};
   img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
 });
 closeButton.addEventListener('click',close);
 overlay.addEventListener('click',e=>{if(e.target===overlay)close();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('is-open'))close();});
})();
</script>
</body>
</html>
